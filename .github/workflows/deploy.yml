# main 브랜치에 push 하면 자동으로 빌드해서 GitHub Pages 에 배포합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
        continue-on-error: true # 타입 경고가 있어도 배포는 진행
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Show built head (진단용)
        run: |
          grep -oE "<link[^>]+>" dist/index.html | cut -c1-140 | while read -r l; do echo "::notice title=head::$l"; done
          grep -c "png" dist/sw.js | sed "s/^/::notice title=sw-png-count::/"; ls dist dist/icons | tr '\n' ' ' | sed 's/^/::notice title=files::/'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
